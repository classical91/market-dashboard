name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    # Playwright 1.56 cannot install Chromium on ubuntu-latest (now 26.04);
    # pin a supported image until Playwright is upgraded.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser regression suites skip themselves when Chromium is missing,
      # and the postinstall hook swallows install failures (`|| true`), so
      # install it explicitly here: a failed download fails CI instead of
      # silently turning those suites into skips.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Test
        run: npm test
