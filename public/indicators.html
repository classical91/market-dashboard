<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indicators Glossary · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <style>
    .glossary-search {
      width: 100%;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
    }
    .glossary-search:focus {
      outline: none;
      border-color: var(--border-hover);
    }
    .glossary-category {
      margin-top: 28px;
      margin-bottom: 14px;
      scroll-margin-top: 16px;
    }
    .glossary-category-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
      gap: 14px;
    }
    .glossary-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .glossary-term {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      text-decoration: none;
    }
    .glossary-term::after { content: " \2192"; color: var(--muted); font-weight: 600; }
    .glossary-term:hover,
    .glossary-term:focus-visible { color: var(--blue); outline: none; text-decoration: underline; text-underline-offset: 3px; }
    .glossary-def {
      font-size: 13px;
      color: var(--soft);
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .glossary-read {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .glossary-read strong { color: var(--soft); }
    .glossary-used-in {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .glossary-used-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-bg);
      border-radius: 8px;
      padding: 4px 9px;
      text-decoration: none;
    }
    .glossary-used-chip:hover { background: rgba(77, 163, 255, 0.22); }
    .glossary-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 24px 0;
      text-align: center;
    }
    .glossary-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .glossary-toolbar .glossary-search { margin-bottom: 0; flex: 1 1 320px; min-width: 0; }
    .glossary-jump {
      flex: 0 1 260px;
      /* A <select> sizes itself to its longest option (~600px here); without
         these it pushes the page wider than a phone screen. */
      min-width: 0;
      max-width: 100%;
      text-overflow: ellipsis;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .glossary-jump:focus { outline: none; border-color: var(--border-hover); }
    @media (max-width: 1024px) {
      /* Clear the sticky mobile top bar when jumping to a category. */
      .glossary-category { scroll-margin-top: 72px; }
    }
    @media (max-width: 640px) {
      .glossary-toolbar .glossary-search { flex: 1 1 100%; }
      .glossary-jump { flex: 1 1 0; }
      .glossary-card { padding: 16px; }
    }
    /* Categories live in a side panel so search results sit right under the
       search bar. Sticky column on wide screens, slide-in drawer below that. */
    .glossary-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 22px;
      align-items: start;
    }
    .glossary-main { min-width: 0; }
    .glossary-main .glossary-category:first-child { margin-top: 4px; }
    .glossary-side {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .glossary-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .glossary-side-close {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
    }
    .glossary-side-list {
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .glossary-side-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--soft);
      text-decoration: none;
    }
    .glossary-side-link:hover,
    .glossary-side-link:focus-visible { background: var(--surface2); color: var(--text); outline: none; }
    .glossary-side-link.is-active { background: var(--accent-bg, var(--surface2)); color: var(--text); }
    .glossary-side-link.is-empty { display: none; }
    .glossary-side-group {
      margin: 10px 4px 4px;
      padding: 10px 6px 4px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .glossary-side-group[hidden] { display: none; }
    .glossary-side-count {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .glossary-side-toggle {
      display: none;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .glossary-side-toggle:focus-visible,
    .glossary-side-close:focus-visible { outline: none; box-shadow: var(--ui-focus); }
    .glossary-side-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 300;
    }
    @media (max-width: 1180px) {
      .glossary-layout { grid-template-columns: minmax(0, 1fr); }
      .glossary-side-toggle { display: block; flex: 0 0 auto; }
      .glossary-side-close { display: block; }
      .glossary-side {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(300px, 86vw);
        max-height: none;
        border-radius: 0;
        border-width: 0 0 0 1px;
        z-index: 301;
        transform: translateX(105%);
        transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
        visibility: hidden;
      }
      .glossary-side.open { transform: translateX(0); visibility: visible; }
      .glossary-side-backdrop.open { display: block; }
    }
    .glossary-card--highlight {
      border-color: var(--blue, #4da3ff);
      box-shadow: 0 0 0 2px rgba(77, 163, 255, 0.35);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .glossary-illustration {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .gi-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 11px;
    }
    .gi-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
    }
    .gi-table td { padding: 3px 6px; }
    .gi-cell {
      display: block;
      border-radius: 6px;
      padding: 4px 8px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
    }
    .gi-up { background: rgba(60, 179, 113, 0.18); color: #4ade80; }
    .gi-down { background: rgba(220, 60, 60, 0.18); color: #f87171; }
    .gi-flat { background: rgba(148, 163, 184, 0.18); color: var(--soft); }
    .gi-diagram {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 11px;
      color: var(--soft);
    }
    .gi-line { flex: 1; height: 2px; background: var(--border); position: relative; }
    .gi-line span {
      position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 10px; color: var(--muted);
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">

    <div class="cmd-page-header">
      <div>
        <div class="cmd-page-title">&#128218; Indicators Glossary</div>
        <div class="cmd-page-subtitle">What each metric means, how to read it, and where it shows up in this dashboard</div>
      </div>
    </div>

    <div class="glossary-layout">
      <div class="glossary-main">
        <div class="glossary-toolbar">
          <input class="glossary-search" id="glossarySearch" type="search" placeholder="Search indicators — e.g. MACD, funding rate, MVRV..." />
          <select class="glossary-jump" id="glossaryJump">
            <option value="">Jump to a concept (A–Z)&hellip;</option>
          </select>
          <button class="glossary-side-toggle" id="glossarySideToggle" type="button" aria-controls="glossarySide" aria-expanded="false">Categories</button>
        </div>

        <div id="glossaryContent"></div>
        <div class="glossary-empty" id="glossaryEmpty" hidden>No indicators match your search.</div>
      </div>

      <aside class="glossary-side" id="glossarySide" aria-label="Glossary categories">
        <div class="glossary-side-head">
          <span>Categories</span>
          <button class="glossary-side-close" id="glossarySideClose" type="button" aria-label="Close categories">&times;</button>
        </div>
        <nav class="glossary-side-list" id="glossaryPills"></nav>
      </aside>
    </div>
    <div class="glossary-side-backdrop" id="glossarySideBackdrop"></div>

    <footer>Indicators Glossary &mdash; <a href="/">Market Command</a></footer>

  </main>
</div>

<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/glossary-library.js"></script>
<script src="/assets/js/indicators.js"></script>
</body>
</html>
