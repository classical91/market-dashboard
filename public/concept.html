<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept · Indicators Glossary · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <style>
    .concept-wrap { max-width: 760px; }
    .concept-crumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .concept-crumbs a { color: var(--soft); text-decoration: none; }
    .concept-crumbs a:hover,
    .concept-crumbs a:focus-visible { color: var(--text); text-decoration: underline; outline: none; }
    .concept-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px;
    }
    .concept-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .concept-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
      margin: 0 0 14px;
      overflow-wrap: anywhere;
    }
    .concept-def {
      font-size: 16px;
      line-height: 1.65;
      color: var(--soft);
      margin: 0 0 18px;
    }
    .concept-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .concept-read {
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .concept-read p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--soft); }
    .concept-illustration { margin-bottom: 18px; overflow-x: auto; }
    .concept-used-in { display: flex; flex-wrap: wrap; gap: 6px; }
    .concept-chip {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-bg);
      border-radius: 8px;
      padding: 5px 10px;
      text-decoration: none;
    }
    .concept-chip:hover { background: rgba(77, 163, 255, 0.22); }
    .concept-pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .concept-pager a {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
    }
    .concept-pager a:hover,
    .concept-pager a:focus-visible { border-color: var(--border-hover); outline: none; }
    .concept-pager .next { text-align: right; grid-column: 2; }
    .concept-pager-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .concept-pager-term { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .concept-related { margin-top: 28px; }
    .concept-related-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .concept-related-list a {
      font-size: 13px;
      color: var(--soft);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      text-decoration: none;
    }
    .concept-related-list a:hover,
    .concept-related-list a:focus-visible { color: var(--text); border-color: var(--border-hover); outline: none; }
    .concept-missing { color: var(--soft); font-size: 14px; line-height: 1.6; }
    .concept-missing a { color: var(--blue); }
    /* Illustrations authored for glossary cards (see indicators.html). */
    .gi-table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .gi-table th {
      text-align: left; color: var(--muted); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 4px 6px; border-bottom: 1px solid var(--border);
    }
    .gi-table td { padding: 3px 6px; color: var(--soft); }
    .gi-cell { display: block; border-radius: 6px; padding: 4px 8px; font-weight: 600; text-align: center; white-space: nowrap; }
    .gi-up { background: rgba(60, 179, 113, 0.18); color: #4ade80; }
    .gi-down { background: rgba(220, 60, 60, 0.18); color: #f87171; }
    .gi-flat { background: rgba(148, 163, 184, 0.18); color: var(--soft); }
    .gi-diagram {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
      border-radius: 10px; font-size: 11px; color: var(--soft);
    }
    .gi-line { flex: 1; height: 2px; background: var(--border); position: relative; }
    .gi-line span {
      position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 10px; color: var(--muted);
    }
    @media (max-width: 640px) {
      .concept-card { padding: 18px 16px; }
      .concept-title { font-size: 22px; }
      .concept-def { font-size: 15px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">
    <div class="concept-wrap">
      <nav class="concept-crumbs" id="conceptCrumbs" aria-label="Breadcrumb">
        <a href="/indicators.html">&larr; Indicators Glossary</a>
      </nav>

      <div id="conceptRoot">
        <p class="concept-missing">Loading concept&hellip;</p>
      </div>
    </div>

    <footer>Indicators Glossary &mdash; <a href="/">Market Command</a></footer>
  </main>
</div>

<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/glossary-library.js"></script>
<script src="/assets/js/indicators.js"></script>
<script src="/assets/js/concept.js"></script>
</body>
</html>
