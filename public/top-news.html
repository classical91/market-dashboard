<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Top 10 · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/briefing.css" />
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">

    <div class="cmd-page-header">
      <div>
        <div class="cmd-page-title">📰 Today's Top 10</div>
        <div class="cmd-page-subtitle">Economics, Stocks and Crypto · what your phone sent that day, or tap Run News to write them now</div>
      </div>
    </div>

    <div class="topnews-toolbar">
      <div class="topnews-day" role="group" aria-label="Day">
        <button type="button" class="briefing-btn topnews-step" id="topNewsPrev" aria-label="Previous day">&lsaquo;</button>
        <input type="date" class="topnews-date" id="topNewsDate" aria-label="Day to gather" />
        <button type="button" class="briefing-btn topnews-step" id="topNewsNext" aria-label="Next day">&rsaquo;</button>
        <button type="button" class="briefing-btn topnews-today" id="topNewsToday" hidden>Today</button>
      </div>
      <div class="topnews-actions">
        <button type="button" class="briefing-btn topnews-run" id="topNewsRun">⚡ Run News</button>
        <button type="button" class="briefing-btn topnews-run topnews-farmbot-btn" id="topNewsFarmbot">📤 Send to FarmBot</button>
        <button type="button" class="briefing-btn topnews-copy-all" id="topNewsCopyAll" disabled>Copy all</button>
      </div>
    </div>
    <div class="topnews-run-message" id="topNewsRunMessage" aria-live="polite" hidden></div>
    <!-- The receipt for the day's Top 10 sent to FarmBot. -->
    <section class="briefing-card topnews-slip" id="topNewsSlip" aria-live="polite" hidden></section>

    <!-- One chip per desk: how many stories, and where they came from. -->
    <nav class="briefing-desks topnews-desks" id="topNewsDesks" aria-label="Desks"></nav>

    <div id="topNewsStatus" class="briefing-age" aria-live="polite">Loading…</div>
    <div id="topNewsSections"></div>

    <footer>Market Command &mdash; Run News writes the three desks; Send to FarmBot merges them into a Top 10 that waits for your approval in FarmBot</footer>
  </main>
</div>

<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/admin-key.js"></script>
<script src="/assets/js/desk-prompts.js"></script>
<script src="/assets/js/briefing-markdown.js"></script>
<script src="/assets/js/briefing-freshness.js"></script>
<script src="/assets/js/top-news.js"></script>
</body>
</html>
