<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Intelligence · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <script src="/assets/js/admin-key.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/youtube-v2.css" />
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">

    <div class="cmd-page-header">
      <div>
        <div class="yt-title-row">
          <div class="cmd-page-title">&#127916; YouTube Intelligence</div>
          <div class="yt-theme-switcher" id="ytThemeSwitcher" hidden>
            <button type="button" class="yt-theme-trigger" id="ytThemeTrigger"
                    aria-expanded="false" aria-controls="ytThemeMenu">
              <span id="ytThemeTriggerLabel">Markets</span>
              <span aria-hidden="true">&#9662;</span>
            </button>
            <div class="yt-theme-menu" id="ytThemeMenu" hidden></div>
          </div>
          <button type="button" class="yt-manage-trigger" id="ytManageChannels">Manage channels</button>
        </div>
        <div class="cmd-page-subtitle" id="ytThemeDescription">Live streams, scheduled streams and latest uploads from trusted channels</div>
      </div>
    </div>

    <div class="yt-split" style="margin-top:14px">
      <div class="yt-player-pane">
        <div class="yt-player-frame">
          <iframe
            id="ytPlayer"
            src=""
            title="YouTube video player"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
        <div class="yt-player-foot">
          <a id="ytPlayerLink" href="" target="_blank" rel="noopener">Watch on YouTube &#8599;</a>
        </div>
      </div>
    </div>

    <!-- LIVE NOW -->
    <div class="section-header" data-section="yt-live">
      <span class="section-label">&#128308; Live Now</span>
      <span class="section-chevron">&#9660;</span>
    </div>
    <div id="yt-live">
      <div class="yt-channel-feeds" id="ytLiveFeeds">
        <div class="yt-empty">Checking for live streams&hellip;</div>
      </div>
    </div>

    <!-- UPCOMING -->
    <div class="section-header" data-section="yt-upcoming">
      <span class="section-label">&#128340; Upcoming</span>
      <span class="section-chevron">&#9660;</span>
    </div>
    <div id="yt-upcoming">
      <div class="yt-channel-feeds" id="ytUpcomingFeeds">
        <div class="yt-empty">Checking for scheduled streams&hellip;</div>
      </div>
    </div>

    <!-- LATEST UPLOADS -->
    <div class="section-header" data-section="yt-rss">
      <span class="section-label">Latest Uploads</span>
      <span class="section-chevron">&#9660;</span>
    </div>
    <div id="yt-rss">
      <div class="yt-channel-feeds" id="ytChannelFeeds">
        <div class="yt-empty">Loading channel feeds&hellip;</div>
      </div>
    </div>

    <footer>YouTube Intelligence &mdash; <a href="/">Overview</a></footer>

  </main>
</div>
<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/sections.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/youtube-channels-admin.js"></script>
<script src="/assets/js/youtube-v2.js"></script>
<script>
  (function () {
    initSections('youtube_v2_collapsed');
  })();
</script>
</body>
</html>
