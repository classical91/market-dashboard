<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Intelligence · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <script src="/assets/js/admin-key.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/youtube-v2.css" />
</head>
<body class="yt-page">
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main yt-main">
    <div class="yt-header">
      <div class="yt-brand">
        <span class="yt-brand-icon" aria-hidden="true"></span>
        <h1>YouTube Intelligence</h1>
      </div>

      <label class="yt-search">
        <span class="yt-search-icon" aria-hidden="true"></span>
        <span class="sr-only">Search videos and channels</span>
        <input id="ytSearch" type="search" placeholder="Search videos and channels" />
      </label>

      <button type="button" class="yt-manage-trigger" id="ytManageChannels">Manage channels</button>
    </div>

    <div class="yt-toolbar">
      <select id="ytCategoryFilter" aria-label="Filter by category">
        <option value="all">All Categories</option>
      </select>
      <nav class="yt-jump-links" aria-label="Video sections">
        <a href="#yt-live"><span class="yt-live-dot" aria-hidden="true"></span>Live Now</a>
        <a href="#yt-upcoming">Upcoming</a>
        <a href="#yt-rss">Latest Uploads</a>
      </nav>
    </div>

    <section id="ytWatch" class="yt-watch" aria-labelledby="ytWatchTitle" hidden>
      <div class="yt-player-frame">
        <iframe
          id="ytPlayer"
          title="YouTube video player"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
      <div class="yt-watch-info">
        <div class="yt-watch-copy">
          <h2 id="ytWatchTitle" tabindex="-1"></h2>
          <p class="yt-watch-meta">
            <span id="ytWatchChannel"></span>
            <span id="ytWatchDetail"></span>
          </p>
        </div>
        <div class="yt-watch-actions">
          <a id="ytPlayerLink" target="_blank" rel="noopener">Watch on YouTube <span aria-hidden="true">&#8599;</span></a>
          <button id="ytCloseWatch" type="button">Close player</button>
        </div>
      </div>
    </section>

    <div class="yt-streams">
      <section class="yt-section" id="yt-live" aria-labelledby="ytLiveHeading">
        <h2 id="ytLiveHeading"><span class="yt-live-dot" aria-hidden="true"></span>Live Now</h2>
        <div class="yt-channel-feeds" id="ytLiveFeeds">
          <div class="yt-empty" role="status">Checking for live streams&hellip;</div>
        </div>
      </section>

      <section class="yt-section" id="yt-upcoming" aria-labelledby="ytUpcomingHeading">
        <h2 id="ytUpcomingHeading">Upcoming</h2>
        <div class="yt-channel-feeds" id="ytUpcomingFeeds">
          <div class="yt-empty" role="status">Checking for scheduled streams&hellip;</div>
        </div>
      </section>
    </div>

    <section class="yt-section" id="yt-rss" aria-labelledby="ytUploadsHeading">
      <h2 id="ytUploadsHeading">Latest Uploads</h2>
      <div class="yt-channel-feeds" id="ytChannelFeeds">
        <div class="yt-empty" role="status">Loading channel feeds&hellip;</div>
      </div>
    </section>

    <footer>YouTube Intelligence &mdash; <a href="/">Overview</a></footer>
  </main>
</div>
<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/youtube-channels-admin.js"></script>
<script src="/assets/js/youtube-v2.js"></script>
</body>
</html>
