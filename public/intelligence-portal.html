<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligence Portal · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/intelligence-portal.css" />
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">

    <div class="cmd-page-header">
      <div>
        <div class="cmd-page-title">Intelligence Portal</div>
        <div class="cmd-page-subtitle">Pick a category and where to open it. Categories are synced from X Intelligence and YouTube Intelligence.</div>
      </div>
    </div>

    <!-- Nothing loads here but the two category lists: choosing opens the
         real page, already on that category. -->
    <form class="ip-launcher" id="ipLauncher" novalidate>
      <div class="ip-field">
        <label class="ip-label" for="ipCategory">Category</label>
        <select id="ipCategory" disabled>
          <option>Loading categories&hellip;</option>
        </select>
      </div>

      <div class="ip-field">
        <label class="ip-label" for="ipDestination">Go to</label>
        <select id="ipDestination" disabled>
          <option value="x">X Intelligence</option>
          <option value="youtube">YouTube Intelligence</option>
        </select>
      </div>

      <button type="submit" class="ip-go" id="ipGo" disabled>Open &#8594;</button>

      <p class="ip-hint" id="ipHint" aria-live="polite"></p>
    </form>

    <footer>Intelligence Portal &mdash; <a href="/x-intelligence.html">X Intelligence</a> &middot; <a href="/youtube-v2.html">YouTube Intelligence</a></footer>

  </main>
</div>
<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/intelligence-portal-sync.js"></script>
<script src="/assets/js/intelligence-portal.js"></script>
</body>
</html>
