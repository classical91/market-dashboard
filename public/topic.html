<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topic Explainers · Indicators Glossary · Market Command</title>
  <script src="/assets/js/settings.js"></script>
  <link rel="stylesheet" href="/assets/styles/command.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <style>
    .topic-wrap { max-width: 860px; }
    .topic-crumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .topic-crumbs a { color: var(--soft); text-decoration: none; }
    .topic-crumbs a:hover,
    .topic-crumbs a:focus-visible { color: var(--text); text-decoration: underline; outline: none; }
    .topic-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px;
    }
    .topic-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .topic-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
      margin: 0 0 14px;
      overflow-wrap: anywhere;
    }
    .topic-intro { font-size: 16px; line-height: 1.65; color: var(--soft); margin: 0 0 16px; }
    .topic-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .topic-why {
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .topic-why p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--soft); }
    .topic-toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .topic-toc a {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--soft);
      text-decoration: none;
    }
    .topic-toc a:hover,
    .topic-toc a:focus-visible { background: var(--surface2); color: var(--text); outline: none; }
    .topic-toc-count { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .topic-section { margin-top: 30px; scroll-margin-top: 16px; }
    .topic-section-title { font-size: 19px; font-weight: 800; color: var(--text); margin: 0 0 6px; letter-spacing: -0.01em; }
    .topic-section-note { font-size: 14px; line-height: 1.65; color: var(--soft); margin: 0 0 14px; }
    .topic-concepts { display: flex; flex-direction: column; gap: 12px; }
    .topic-concept {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      scroll-margin-top: 16px;
    }
    .topic-concept-heading { margin: 0; }
    .topic-concept-term {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 6px;
      text-decoration: none;
    }
    .topic-concept-term::after { content: " \2192"; color: var(--muted); font-weight: 600; }
    .topic-concept-term:hover,
    .topic-concept-term:focus-visible { color: var(--blue); outline: none; text-decoration: underline; text-underline-offset: 3px; }
    .topic-concept p { margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: var(--soft); }
    .topic-concept .topic-concept-read { font-size: 13px; color: var(--muted); }
    .topic-concept .topic-concept-read strong { color: var(--soft); }
    .topic-concept-illustration { margin: 4px 0 8px; overflow-x: auto; }
    .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-bg);
      border-radius: 8px;
      padding: 4px 9px;
      text-decoration: none;
    }
    .topic-chip:hover,
    .topic-chip:focus-visible { background: rgba(77, 163, 255, 0.22); outline: none; }
    .topic-takeaways { margin-top: 30px; }
    .topic-takeaways ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
    .topic-takeaways li { font-size: 14px; line-height: 1.6; color: var(--soft); }
    .topic-shows-up { margin-top: 24px; }
    .topic-pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }
    .topic-pager a {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
    }
    .topic-pager a:hover,
    .topic-pager a:focus-visible { border-color: var(--border-hover); outline: none; }
    .topic-pager .next { text-align: right; grid-column: 2; }
    .topic-pager-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .topic-pager-term { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Topic directory (/topic.html with no id). */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 12px;
    }
    .topic-tile {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
    }
    .topic-tile:hover,
    .topic-tile:focus-visible { border-color: var(--border-hover); outline: none; box-shadow: var(--ui-focus); }
    .topic-tile-title { font-size: 15px; font-weight: 700; }
    .topic-tile-summary { font-size: 13px; line-height: 1.55; color: var(--soft); }
    .topic-tile-count { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .topic-missing { color: var(--soft); font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
    .topic-missing a { color: var(--blue); }
    /* Illustrations authored for glossary cards (see indicators.html). */
    .gi-table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .gi-table th {
      text-align: left; color: var(--muted); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 4px 6px; border-bottom: 1px solid var(--border);
    }
    .gi-table td { padding: 3px 6px; color: var(--soft); }
    .gi-cell { display: block; border-radius: 6px; padding: 4px 8px; font-weight: 600; text-align: center; white-space: nowrap; }
    .gi-up { background: rgba(60, 179, 113, 0.18); color: #4ade80; }
    .gi-down { background: rgba(220, 60, 60, 0.18); color: #f87171; }
    .gi-flat { background: rgba(148, 163, 184, 0.18); color: var(--soft); }
    .gi-diagram {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
      border-radius: 10px; font-size: 11px; color: var(--soft);
    }
    .gi-line { flex: 1; height: 2px; background: var(--border); position: relative; }
    .gi-line span {
      position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 10px; color: var(--muted);
    }
    @media (max-width: 1024px) {
      /* Clear the sticky mobile top bar when jumping to a section. */
      .topic-section,
      .topic-concept { scroll-margin-top: 72px; }
    }
    @media (max-width: 640px) {
      .topic-card { padding: 18px 16px; }
      .topic-title { font-size: 22px; }
      .topic-intro { font-size: 15px; }
      .topic-concept { padding: 14px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="cmd-sidebar"></aside>
  <main class="cmd-main">
    <div class="topic-wrap">
      <nav class="topic-crumbs" id="topicCrumbs" aria-label="Breadcrumb">
        <a href="/indicators.html">&larr; Indicators Glossary</a>
      </nav>

      <div id="topicRoot">
        <p class="topic-missing">Loading topic&hellip;</p>
      </div>
    </div>

    <footer>Indicators Glossary &mdash; <a href="/">Market Command</a></footer>
  </main>
</div>

<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/glossary-topics.js"></script>
<script src="/assets/js/indicators.js"></script>
<script src="/assets/js/topic.js"></script>
</body>
</html>
